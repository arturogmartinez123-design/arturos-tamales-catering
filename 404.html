<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | Arturo’s Tamales &amp; Catering</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1c1c1c" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/logo-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&amp;family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="missing">
  <main class="missing-main">
    <a class="brand" href="/">
      <img class="brandmark brandmark-full" data-logo src="/assets/logo-header.svg" alt="Arturo’s Tamales &amp; Catering" width="824" height="150" />
      <img class="brandmark brandmark-short" data-logo-compact src="/assets/logo-header-compact.svg" alt="Arturo’s Tamales &amp; Catering" width="784" height="118" />
    </a>
    <p class="eyebrow">404</p>
    <h1>That page isn’t on the menu.</h1>
    <p>The link may be old. The tamales are still on the home page.</p>
    <a class="btn btn-primary" href="/">Back to Arturo’s</a>
  </main>
  <script src="/config.js"></script>
  <script>
    (function () {
      var cfg = window.ArturoConfig || {};
      function abs(mark) {
        if (!mark) return "";
        return mark.charAt(0) === "/" ? mark : "/" + String(mark).replace(/^\.\//, "");
      }
      var mark = abs(cfg.logoMark);
      if (mark) document.querySelectorAll("[data-logo]").forEach(function (img) { img.src = mark; });
      var compact = abs(cfg.logoMarkCompact);
      if (compact) document.querySelectorAll("[data-logo-compact]").forEach(function (img) { img.src = compact; });
    })();
  </script>
</body>
</html>
